<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

          <summary>{{.Title}}</summary>
          <div class="docs-topics">
            {{range .Topics}}

          </div>
        </details>

    </aside>
    <main class="docs-content">
      <article class="markdown">
        {{.Page.Content}}
      </article>
    </main>
  </div>

</html>
